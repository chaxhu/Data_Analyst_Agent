[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranit Chatterjee", email = "P.Chatterjee2@newcastle.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
